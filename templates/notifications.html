{% extends "base.html" %}{% block title %}Notificações · GeoDemandas{% endblock %}{% block content %}<div class="space-y-6"><header><p class="text-xs font-black uppercase tracking-wider text-brandt">Atualizações</p><h1 class="mt-2 text-3xl font-black text-slate-950">Notificações</h1></header><section class="space-y-3">{% for item in notifications %}<form method="post" action="/notificacoes/{{ item.id }}/ler"><button class="premium-card block min-h-16 w-full p-5 text-left {{ 'ring-2 ring-emerald-200' if not item.read_at else '' }}"><span class="text-sm font-black text-slate-900">{{ item.title }}</span><span class="mt-1 block text-sm font-medium text-slate-600">{{ item.message }}</span><span class="mt-2 block text-xs font-semibold text-slate-400">{{ item.created_at|local_datetime }}</span></button></form>{% else %}<div class="premium-card p-10 text-center text-sm font-semibold text-slate-500">Nenhuma notificação.</div>{% endfor %}</section></div>{% endblock %}
